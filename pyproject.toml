[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offgrid-power"
version = "0.1.0"
description = "Raspberry Pi supervisory monitoring for the off-grid power system."
requires-python = ">=3.10"
dependencies = [
  "pymodbus==3.13.0",
  "python-can==4.6.1",
  "magnum-pi==2026.3.1.1",
]

[project.optional-dependencies]
sensors = [
  "adafruit-blinka>=8,<10",
  "adafruit-circuitpython-dht>=4,<5",
]

[project.scripts]
offgrid-can-decode = "offgrid_power.cli.can_decode:main"
offgrid-can-probe = "offgrid_power.cli.can_probe:main"
offgrid-can-survey = "offgrid_power.cli.can_survey:main"
offgrid-r2-export = "offgrid_power.cli.r2_export:main"
offgrid-terminal-display = "offgrid_power.cli.api_terminal_display:main"
offgrid-supervisor = "offgrid_power.cli.supervisor_display:main"
offgrid-web-display = "offgrid_power.cli.web_display:main"

[tool.setuptools]
package-dir = {"" = "software/pi-controller/src"}

[tool.setuptools.packages.find]
where = ["software/pi-controller/src"]
