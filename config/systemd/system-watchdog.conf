# Installed to /etc/systemd/system.conf.d/10-offgrid-watchdog.conf
#
# Hardware-watchdog backstop. systemd (PID 1) opens /dev/watchdog (BCM2835) and
# pets it; if systemd itself ever stops looping (kernel deadlock / total lockup),
# the SoC force-resets after the timeout -- the one failure class no software
# recovery can reach. Codified here so it survives a card reimage.
#
# RebootWatchdogSec also re-arms the timer *during* shutdown, so a reboot that
# hangs unmounting a wedged USB device (a process stuck in D-state on dead I/O,
# as in the 2026-06-30 brownout) is still forced through instead of needing a
# human to pull power. This is the safety net the supervisor-blind escalation
# watchdog (offgrid-supervisor-watchdog) relies on when it calls `systemctl reboot`.
[Manager]
RuntimeWatchdogSec=1min
RebootWatchdogSec=2min
