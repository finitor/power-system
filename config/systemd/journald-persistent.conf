# Installed to /etc/systemd/journald.conf.d/99-offgrid-persistent.conf
#
# Overrides Raspberry Pi OS's /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf,
# which sets Storage=volatile to keep the journal in RAM and spare the SD card.
# That default means the journal is lost on every reboot -- so after the
# 2026-06-30 overnight USB brownout (onboard eth + all USB serial/CAN adapters
# dropped together; supervisor ran blind, hard power-cycled at ~06:53 EDT) the
# kernel/USB logs were gone and the incident had to be reconstructed from the
# metrics SQLite. Persist the journal so the next incident is diagnosable.
#
# Capped so SD-card write wear stays negligible. The journal lives on the SD
# card (mmcblk0p2), which is on the dedicated MMC bus -- independent of the USB
# bus that browned out -- so it keeps logging through exactly this failure mode.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFiles=10
SystemMaxFileSize=20M
