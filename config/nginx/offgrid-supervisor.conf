server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # The Kindle wall display is bookmarked to port 8080 from before nginx
    # fronted the supervisor. Listen there too so it gets the retry page
    # during supervisor restarts instead of a dead native error page.
    listen 8080;
    listen [::]:8080;

    server_name _;

    # Force a fresh TCP connection on every request. Prevents stale pre-outage
    # keepalive sockets from causing silent failures after network reconnection.
    keepalive_timeout 0;

    access_log /var/log/nginx/offgrid-supervisor.access.log;
    error_log /var/log/nginx/offgrid-supervisor.error.log;

    # Site icons bypass the retry interception below: during a supervisor
    # restart the generic handler would return the HTML stand-by page with
    # status 200 for /favicon.ico, and Safari would cache that HTML as the
    # site's icon (it ignores Cache-Control for its icon database). Passing
    # the error through instead yields a plain 502 the browser treats as a
    # failed icon fetch and ignores, keeping its previously cached icon.
    location ~ ^/(favicon\.(ico|png|svg)|apple-touch-icon(-precomposed)?\.png)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        error_page 502 503 504 = @supervisor_retry;
    }

    location @supervisor_retry {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="refresh" content="5">
<title>Off-Grid Power</title>
<style>body{font-family:serif;color:#000;background:#fff;margin:8px;font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;}.small{font-size:12px;}</style>
</head>
<body>
<h2>Offgrid supervisor unreachable</h2>
<p>Stand by.</p>
<p class="small">Retrying every 5 seconds.</p>
</body>
</html>
';
    }
}
